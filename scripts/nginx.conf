# Nginx Configuration Blueprint for foldable.onfc.xyz
# Place this at /etc/nginx/sites-available/foldable.onfc.xyz on your VPS
# Then symlink it: sudo ln -s /etc/nginx/sites-available/foldable.onfc.xyz /etc/nginx/sites-enabled/
# Then verify with: sudo nginx -t
# Finally reload Nginx: sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name foldable.onfc.xyz;

    access_log /var/log/nginx/foldable.onfc.xyz.access.log;
    error_log /var/log/nginx/foldable.onfc.xyz.error.log;

    # Reverse proxy to the local Node.js server managed by PM2 on port 3040
    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        
        # Enable WebSockets / persistent connections
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Pass client headers and host details to downstream server
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable proxy buffering for instant response
        proxy_buffering off;
    }

    # Ensure Service Worker and HTML index are NOT cached by Nginx either
    location ~* \.(?:html|json|txt|xml)$ {
        proxy_pass http://127.0.0.1:3040;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location ~* sw\.js$ {
        proxy_pass http://127.0.0.1:3040;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Static assets folder (Vite hashed files under /assets/) can be heavily cached by Nginx
    location /assets/ {
        proxy_pass http://127.0.0.1:3040;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
